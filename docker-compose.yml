services:
  web:
    build: .
    ports:
      - "5001:5001"

  enrich-ip:
    build: .
    entrypoint: ["python", "enrich-ip.py"]
    volumes:
      # Mount input/output directory
      - ./data:/data
      # Mount API key cache files from host (optional)
      - ~/.enrichip-ip-db-key:/root/.enrichip-ip-db-key:ro
      - ~/.enrichip-dnsdumpster-key:/root/.enrichip-dnsdumpster-key:ro
      - ~/.enrichip-abuseipdb-key:/root/.enrichip-abuseipdb-key:ro
      - ~/.ip-db-full.mmb:/root/.ip-db-full.mmb:ro
    # Example command - override with your own arguments
    # command: ["--input-file", "/data/input.csv", "--use-ip-db", "--use-dnsbl"]
